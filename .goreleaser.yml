version: 2

project_name: wt

builds:
  - id: wt
    binary: wt
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: archive
    ids:
      - wt
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

homebrew_casks:
  - name: wt
    ids:
      - archive
    binaries:
      - wt
    repository:
      owner: mikker
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/mikker/wt
    description: Ephemeral Git worktree manager
    commit_msg_template: "Update wt cask to {{ .Tag }}"
    # Use Homebrew's declarative steps DSL instead of the deprecated postflight
    # hook. Move this to hooks.post.install_steps once GoReleaser supports it.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/wt"], must_succeed: false
        end
      end
